worker_processes 1;
pid /run/im-nginx.pid;
error_log /var/log/im-nginx-error.log;
events { worker_connections 1024; }
http {
    lua_package_path "/www/server/nginx/lib/lua/?.lua;;";
    access_log /var/log/im-nginx-access.log;
    include /www/server/nginx/conf/mime.types;
    server_tokens off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    limit_req_zone $binary_remote_addr zone=chat:10m rate=5r/s;
    server {
        listen 80;
        server_name im.cyfljj.com api.cyfljj.com rtc.cyfljj.com;
        location /.well-known/acme-challenge/ { root /var/lib/im-acme; }
        location / { return 308 https://$host$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name api.cyfljj.com;
        ssl_certificate /etc/letsencrypt/live/im-cyfljj-com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/im-cyfljj-com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=86400" always;
        location = /v0/channels {
            limit_req zone=chat burst=20 nodelay;
            proxy_pass http://127.0.0.1:6060;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 90s;
        }
        location / { return 503; }
    }
    server {
        listen 443 ssl;
        server_name im.cyfljj.com;
        ssl_certificate /etc/letsencrypt/live/im-cyfljj-com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/im-cyfljj-com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        root /www/wwwroot/github/im/.runtime/web;
        index index.html;
        location ~ /\. { deny all; }
        location / { try_files $uri $uri/ =404; }
    }
    server {
        listen 443 ssl;
        server_name rtc.cyfljj.com;
        ssl_certificate /etc/letsencrypt/live/im-cyfljj-com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/im-cyfljj-com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        location / {
            default_type application/json;
            return 503 '{"error":"service_not_ready"}';
        }
    }
}

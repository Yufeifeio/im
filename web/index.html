<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IM System</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#13233d}.app{max-width:900px;margin:auto;padding:32px}.card{background:#fff;border-radius:14px;padding:24px;margin:16px 0;box-shadow:0 4px 16px #10204012}button{background:#1565d8;color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}.muted{color:#64748b}</style><div class=app><h1>IM 系统</h1><p class=muted>Tinode 聊天能力、签到、商城、会员与多人会议业务入口</p><div class=card><h2>业务模块</h2><p>聊天 · 签到 · 商城 · 会员 · 多人会议</p><button onclick="checkin()">今日签到</button> <button onclick="loadProducts()">加载商城</button><pre id=out></pre></div></div><script>const out=document.querySelector('#out');async function checkin(){const r=await fetch('/api/checkin/status');out.textContent=await r.text()}async function loadProducts(){const r=await fetch('/api/products');out.textContent=await r.text()}</script></html>
